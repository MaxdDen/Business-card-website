<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CMS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}" />
    <script src="{{ url_for('static', path='js/global-vars.js') }}"></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/language.js') }}"></script>
    <script src="{{ url_for('static', path='js/translations.js') }}"></script>
    <script src="{{ url_for('static', path='js/session-monitor.js') }}"></script>
  </head>
  <body class="min-h-dvh bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <header class="w-full border-b border-gray-200 dark:border-gray-800">
      <div class="container max-w-6xl py-3 flex items-center justify-between">
        <a href=# class="font-semibold">Business Card CMS</a>
        <div class="flex items-center gap-3">
          <!-- Language Switcher -->
          {% if supported_languages %}
          <div class="flex items-center space-x-2">
            {% for supported_lang in supported_languages %}
            <button onclick="switchLanguage('{{ supported_lang }}')"
                    data-language-button="{{ supported_lang }}"
                    class="px-3 py-1 text-sm rounded-md font-medium transition-all duration-200
                           {% if supported_lang == lang %}
                           bg-blue-600 text-white shadow-sm
                           {% else %}
                           text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white
                           {% endif %}"
                    title="Switch to {{ supported_lang.upper() }}">
                {{ supported_lang.upper() }}
            </button>
            {% endfor %}
          </div>
          {% endif %}
          
          <!-- Theme Toggle -->
          <button onclick="toggleTheme()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
            <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
            </svg>
            <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
          </button>
          
          <nav class="flex items-center gap-3 text-sm">
            <a href="/" class="hover:underline">
              {{ t.home or 'Home' }}
            </a>
          </nav>
        </div>
      </div>
    </header>    
    <main class="container max-w-6xl py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
